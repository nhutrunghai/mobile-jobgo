<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#002109",
              "on-secondary-fixed-variant": "#195127",
              "error-container": "#ffdad6",
              "on-tertiary-fixed-variant": "#8e0b36",
              "background": "#f8faf8",
              "outline": "#6d7b6c",
              "on-primary-fixed": "#002109",
              "inverse-on-surface": "#eff1ef",
              "on-surface-variant": "#3d4a3d",
              "on-background": "#191c1b",
              "on-error-container": "#93000a",
              "surface-container-highest": "#e1e3e1",
              "secondary-container": "#b2eeb6",
              "on-error": "#ffffff",
              "tertiary-fixed-dim": "#ffb2bc",
              "surface": "#f8faf8",
              "inverse-primary": "#52e078",
              "secondary-fixed-dim": "#99d59e",
              "on-tertiary-fixed": "#400013",
              "on-primary-fixed-variant": "#005321",
              "surface-container-low": "#f2f4f2",
              "secondary": "#336a3d",
              "on-secondary-container": "#376e41",
              "outline-variant": "#bccbb9",
              "primary-container": "#00b14f",
              "on-primary": "#ffffff",
              "error": "#ba1a1a",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#fd6584",
              "inverse-surface": "#2e3130",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e6e9e7",
              "surface-bright": "#f8faf8",
              "on-primary-container": "#003a15",
              "on-secondary": "#ffffff",
              "primary-fixed-dim": "#52e078",
              "surface-dim": "#d8dad9",
              "secondary-fixed": "#b5f1b9",
              "on-surface": "#191c1b",
              "primary": "#006e2e",
              "surface-container": "#eceeec",
              "primary-fixed": "#71fe91",
              "tertiary": "#af294c",
              "surface-variant": "#e1e3e1",
              "tertiary-fixed": "#ffd9dd",
              "on-tertiary-container": "#680024",
              "surface-tint": "#006e2e"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background font-body text-on-background flex justify-center items-start min-h-screen">
<!-- Main Container - Fixed Height 884px -->
<div class="w-full max-w-[430px] h-[884px] bg-surface relative flex flex-col overflow-hidden shadow-2xl">
<!-- TopAppBar (From Shared Components JSON) -->
<header class="flex items-center px-6 h-16 w-full bg-[#f8faf8] dark:bg-slate-900 docked full-width top-0 z-10">
<div class="flex items-center gap-4 w-full">
<button class="text-[#006e2e] dark:text-[#00b14f] hover:opacity-80 transition-opacity scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 px-6 pt-8"><h2 class="font-manrope font-bold text-3xl mb-6 text-[#000000]">Quên mật khẩu</h2>
<!-- Instruction Text -->
<div class="mb-8">
<p class="font-body text-on-surface-variant leading-relaxed text-base">
                    Vui lòng nhập email đăng ký của bạn. Chúng tôi sẽ gửi hướng dẫn đổi mật khẩu tới email này.
                </p>
</div>
<!-- Email Input Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant ml-1" for="email">
                    Email
                </label>
<input class="w-full bg-surface-container-lowest border-outline-variant border-[1px] border-opacity-30 rounded-lg h-14 px-4 focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-surface-dim" id="email" placeholder="example@gmail.com" type="email"/>
</div>
<!-- Decorative Visual (Asymmetric Editorial Style) -->
<div class="mt-12 flex justify-center opacity-10">
<div class="relative w-48 h-48">
<div class="absolute inset-0 bg-primary-container rounded-full blur-3xl"></div>
<span class="material-symbols-outlined text-[120px] text-primary absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" data-icon="lock_reset">lock_reset</span>
</div>
</div>
</main>
<!-- Footer Action Button (Fixed Position within the 884px container) -->
<div class="p-6 pb-12 w-full mt-auto">
<button class="w-full bg-[#00b14f] text-white font-headline font-bold text-base py-4 shadow-lg shadow-primary-container/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 rounded-lg">
                Tạo lại mật khẩu
            </button>
</div>
<!-- Semantic Shell: Suppression applied (No BottomNavBar for transactional flow) -->
</div>
</body></html>
