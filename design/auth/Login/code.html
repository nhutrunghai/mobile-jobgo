<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - TopCV</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="background-patterns">
    /* Decorative dots in the background corners as seen in the screenshot */
    .bg-dots {
      background-image: radial-gradient(#00B14F 1.5px, transparent 1.5px);
      background-size: 15px 15px;
      opacity: 0.1;
    }
  </style>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col items-center relative overflow-hidden">
<!-- BEGIN: Decorative Background Elements -->
<div aria-hidden="true" class="absolute top-0 left-0 w-32 h-32 bg-dots -translate-x-12 -translate-y-12"></div>
<div aria-hidden="true" class="absolute bottom-0 right-0 w-48 h-48 bg-dots translate-x-16 translate-y-16"></div>
<!-- END: Decorative Background Elements -->
<main class="w-full max-w-md px-8 pt-20 pb-10 flex flex-col items-center flex-grow z-10">
<!-- BEGIN: Header Section -->
<section class="text-center mb-12" data-purpose="branding">
<div class="flex items-center justify-center mb-4">
<!-- Logo Text -->
<h1 class="text-4xl font-extrabold tracking-tight" style="color: #00B14F;">
          Top<span class="text-[#002B19]">cv</span>
</h1>
</div>
<h2 class="text-xl font-semibold text-[#002B19]">Chào mừng bạn đến với TopCV</h2>
</section>
<!-- END: Header Section -->
<!-- BEGIN: Login Form -->
<form action="#" class="w-full space-y-6" data-purpose="login-form" method="POST">
<!-- Email Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-12 pr-4 py-4 border border-gray-300 rounded-xl focus:ring-[#00B14F] focus:border-[#00B14F] bg-white transition-all outline-none" placeholder="Email" type="email"/>
</div>
<!-- Password Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-12 pr-12 py-4 border border-gray-300 rounded-xl focus:ring-[#00B14F] focus:border-[#00B14F] bg-white transition-all outline-none" placeholder="Nhập mật khẩu" type="password"/>
<!-- Toggle Visibility Icon -->
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600" type="button">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.956 9.956 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Forgot Password -->
<div class="text-right">
<a class="text-sm font-medium text-[#00B14F] hover:underline" href="#">Quên mật khẩu?</a>
</div>
<!-- Login Button -->
<button class="w-full py-4 px-6 text-white font-bold rounded-full transition-all active:scale-95 shadow-lg shadow-green-100" style="background-color: #00B14F;" type="submit">
        Đăng nhập
      </button>
</form>
<!-- END: Login Form -->
<!-- BEGIN: Social Login Section -->
<section class="w-full mt-12 text-center px-4" data-purpose="social-login">
<div class="flex items-center justify-center mb-6">
<div class="flex-grow border-t border-gray-200"></div>
<span class="px-4 text-sm font-medium text-gray-500">Hoặc đăng nhập bằng</span>
<div class="flex-grow border-t border-gray-200"></div>
</div>
<div class="flex justify-center space-x-6">
<!-- Facebook -->
<button class="w-14 h-14 rounded-full flex items-center justify-center bg-[#1877F2] text-white shadow-md hover:opacity-90">
<svg class="w-7 h-7" fill="currentColor" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
</button>
<!-- Google -->
<button class="w-14 h-14 rounded-full flex items-center justify-center bg-white border border-gray-100 shadow-md hover:bg-gray-50">
<svg class="w-7 h-7" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</button>
<!-- Apple -->
<button class="w-14 h-14 rounded-full flex items-center justify-center bg-black text-white shadow-md hover:opacity-90">
<svg class="w-7 h-7" fill="currentColor" viewbox="0 0 24 24"><path d="M17.073 10.117c-.03-2.693 2.183-3.99 2.285-4.053-1.251-1.828-3.193-2.08-3.886-2.108-1.656-.167-3.226 1.004-4.066 1.004-.838 0-2.073-.973-3.456-.945-1.815.027-3.486 1.054-4.421 2.67-1.886 3.26-.484 8.085 1.353 10.742.899 1.303 1.967 2.766 3.375 2.713 1.357-.052 1.868-.87 3.504-.87 1.636 0 2.107.87 3.535.843 1.455-.027 2.378-1.328 3.27-2.628 1.03-1.503 1.456-2.958 1.478-3.033-.031-.015-2.846-1.092-2.877-4.335zM14.658 3.03c.741-.901 1.242-2.152 1.104-3.403-1.074.043-2.373.714-3.141 1.615-.69.799-1.294 2.074-1.133 3.303 1.198.093 2.43-.615 3.17-1.515z"></path></svg>
</button>
</div>
</section>
<!-- END: Social Login Section -->
<!-- BEGIN: Footer Section -->
<footer class="mt-auto pt-10 pb-6 text-center space-y-4" data-purpose="registration-links">
<div class="text-sm font-medium">
<span class="text-gray-500">Bạn chưa có tài khoản?</span>
<a class="text-[#00B14F] hover:underline ml-1 font-bold" href="#">Đăng ký ngay</a>
</div>
<div class="w-full max-w-[280px] mx-auto border-t border-gray-200"></div>
<div class="text-sm font-medium">
<a class="text-[#00B14F] hover:underline" href="#">Trải nghiệm không cần đăng nhập</a>
</div>
</footer>
<!-- END: Footer Section -->
<!-- Mobile Bottom Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-black rounded-full mt-4 mb-2 mx-auto"></div>
</main>
<script data-purpose="form-interactions">
    // Minimal interaction placeholder
    document.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      console.log('Login attempted');
    });
  </script>
</body></html>
