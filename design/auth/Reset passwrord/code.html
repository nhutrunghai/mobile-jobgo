<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nhập mã xác nhận - The Career Curator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#195127",
              "on-secondary": "#ffffff",
              "background": "#f8faf8",
              "on-tertiary-fixed-variant": "#8e0b36",
              "error-container": "#ffdad6",
              "surface-tint": "#006e2e",
              "outline": "#6d7b6c",
              "on-primary-fixed-variant": "#005321",
              "surface-container-low": "#f2f4f2",
              "on-background": "#191c1b",
              "on-tertiary-container": "#680024",
              "inverse-on-surface": "#eff1ef",
              "error": "#ba1a1a",
              "surface-container-lowest": "#ffffff",
              "primary-fixed-dim": "#52e078",
              "on-tertiary-fixed": "#400013",
              "on-primary-container": "#003a15",
              "surface-container-high": "#e6e9e7",
              "surface": "#f8faf8",
              "secondary-fixed": "#b5f1b9",
              "on-tertiary": "#ffffff",
              "surface-container-highest": "#e1e3e1",
              "secondary": "#336a3d",
              "primary": "#006e2e",
              "on-error-container": "#93000a",
              "on-surface": "#191c1b",
              "on-secondary-container": "#376e41",
              "tertiary": "#af294c",
              "secondary-fixed-dim": "#99d59e",
              "tertiary-fixed-dim": "#ffb2bc",
              "surface-container": "#eceeec",
              "secondary-container": "#b2eeb6",
              "tertiary-fixed": "#ffd9dd",
              "primary-fixed": "#71fe91",
              "on-surface-variant": "#3d4a3d",
              "inverse-surface": "#2e3130",
              "tertiary-container": "#fd6584",
              "on-error": "#ffffff",
              "surface-dim": "#d8dad9",
              "surface-bright": "#f8faf8",
              "inverse-primary": "#52e078",
              "on-primary-fixed": "#002109",
              "primary-container": "#00b14f",
              "on-secondary-fixed": "#002109",
              "outline-variant": "#bccbb9",
              "surface-variant": "#e1e3e1",
              "on-primary": "#ffffff"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f8faf8;
            height: 884px;
            max-height: 884px;
            overflow: hidden;
        }
        .main-canvas {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body text-on-background">
<div class="main-canvas max-w-md mx-auto relative bg-background">
<!-- TopAppBar -->
<header class="flex items-center h-16 px-6 w-full docked w-full top-0 bg-[#f8faf8] dark:bg-zinc-950 no-border bg-[#f1f3f1] dark:bg-zinc-900 flat no shadows z-10">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-zinc-200/50 dark:hover:bg-zinc-800/50 transition-colors active:scale-95 duration-200 text-[#006e2e] dark:text-[#00b14f]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 pt-4 pb-24 overflow-y-auto">
<!-- Header Title -->
<div class="mb-8">
<h1 class="font-headline font-bold text-2xl tracking-tight text-on-background mb-4">Nhập mã xác nhận</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">
                    Chúng tôi đã gửi mã xác nhận tới địa chỉ <span class="font-semibold text-on-surface">nhuthifc@gmail.com</span>. Vui lòng kiểm tra hòm thư hoặc hòm thư spam để lấy mã và nhập vào bên dưới.
                </p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Input field: Code -->
<div class="space-y-2">
<label class="text-sm font-semibold flex items-center gap-1">
                        Mã xác nhận <span class="text-tertiary">*</span>
</label>
<div class="relative group">
<input class="w-full h-14 border-none rounded-lg px-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline bg-white border border-zinc-200" placeholder="Nhập mã xác nhận" type="text"/>
</div>
</div>
<!-- Input field: New Password -->
<div class="space-y-2">
<label class="text-sm font-semibold flex items-center gap-1">
                        Mật khẩu mới <span class="text-tertiary">*</span>
</label>
<div class="relative group">
<input class="w-full h-14 border-none rounded-lg px-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline bg-white border border-zinc-200" placeholder="Nhập mật khẩu mới" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Input field: Confirm Password -->
<div class="space-y-2">
<label class="text-sm font-semibold flex items-center gap-1">
                        Nhập lại mật khẩu <span class="text-tertiary">*</span>
</label>
<div class="relative group">
<input class="w-full h-14 border-none rounded-lg px-4 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline bg-white border border-zinc-200" placeholder="Nhập lại mật khẩu mới" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Expiration Warning -->
<div class="pt-4 text-center">
<p class="text-sm text-on-surface-variant">
                        Mã xác nhận hết hạn sau 1 giờ kể từ khi bạn nhận được mã. 
                        <a class="text-primary-container font-bold hover:underline" href="#">Gửi lại mã</a>
</p>
</div>
</form>
</main>
<!-- BottomNavBar / Footer Buttons -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex items-center gap-4 px-6 py-4 pb-8 bg-[#f8faf8]/80 dark:bg-zinc-950/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(25,28,27,0.06)] max-w-md mx-auto rounded-t-2xl">
<!-- Back Button -->
<button class="flex-1 h-14 flex items-center justify-center gap-2 bg-surface-container-highest text-on-surface font-semibold hover:opacity-90 active:scale-[0.98] transition-all duration-150 rounded-xl">
<span class="material-symbols-outlined text-xl" data-icon="chevron_left">chevron_left</span>
                Quay lại
            </button>
<!-- Submit Button -->
<button class="flex-[1.5] h-14 flex items-center justify-center gap-2 bg-gradient-to-br from-[#006e2e] to-[#00b14f] text-white font-semibold hover:opacity-90 active:scale-[0.98] transition-all duration-150 rounded-xl">
                Cập nhật mật khẩu
                <span class="material-symbols-outlined text-xl" data-icon="check_circle">check_circle</span>
</button>
</footer>
<!-- Decorative Element -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl -z-10"></div>
<div class="absolute top-1/2 -left-32 w-48 h-48 bg-tertiary/5 rounded-full blur-3xl -z-10"></div>
</div>
</body></html>
